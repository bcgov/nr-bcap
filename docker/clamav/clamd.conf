# The image's own defaults, plus the size limits. clamd's built-in StreamMaxLength
# is 25M, and MaxFileSize/MaxScanSize would then bind first and pass a large file
# without scanning it, so all three move together. AlertExceedsMax turns anything
# still over a limit into a detection rather than a silent clean result.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 1024M
AlertExceedsMax yes
