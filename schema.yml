          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
    PermitApplication:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          readOnly: true
          nullable: true
        descriptors:
          readOnly: true
          nullable: true
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
