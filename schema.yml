        created_by_name:
          type: string
          description: Display name of the user who created the application (principaluser).
        created_date:
          type: string
          description: ISO timestamp the application was submitted (its createdtime),
            or the draft was created when is_draft.
        project_name:
          type: string
          description: Permit application's project name.
        application_number:
          type: string
          description: Permit application's human-readable application reference;
            not a GUID.
        industrial_sector:
          type: string
          description: Permit application's industrial sector (reference label).
        permit_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the related HCA Permit; its drill-in
            GUID.
        permit_number:
          type: string
          description: Permit number of the related HCA Permit.
        urgency:
          type: integer
          description: Relative urgency from the target completion date and the current
            date.
        priority_level:
          type: string
          description: Permit application's priority level (reference label).
      required:
      - id
    ExternalDashboardPage:
      type: object
      description: |-
        One page of external dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them). Each card's fields
        are documented on the ExternalDashboardCard dataclass (as field help_text),
        so the per-field descriptions surface in the generated OpenAPI spec.
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDashboardCard'
