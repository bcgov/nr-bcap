openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/dashboard:
    get:
      operationId: api_dashboard_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: order_by
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - UNASSIGNED
          - ASSIGNED_TO_ME
          - ASSIGNED_TO_ASSOCIATED_COMPANIES
          type: string
          minLength: 1
        description: |-
          * `UNASSIGNED` - Unassigned
          * `ASSIGNED_TO_ME` - Assigned to me
          * `ASSIGNED_TO_ASSOCIATED_COMPANIES` - Assigned to associated companies
      tags:
      - dashboard
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
          description: ''
  /bcap/api/resource/process_requirement/{id}:
    get:
      operationId: api_resource_process_requirement_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    put:
      operationId: api_resource_process_requirement_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    patch:
      operationId: api_resource_process_requirement_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    delete:
      operationId: api_resource_process_requirement_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/api/resource_draft/{graph_slug}:
    get:
      operationId: api_resource_draft_list
      description: GET the current user's drafts for a graph; POST a new draft.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceDraft'
          description: ''
    post:
      operationId: api_resource_draft_create
      description: GET the current user's drafts for a graph; POST a new draft.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
  /bcap/api/resource_draft/{graph_slug}/{id}:
    get:
      operationId: api_resource_draft_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    put:
      operationId: api_resource_draft_update
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    patch:
      operationId: api_resource_draft_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    delete:
      operationId: api_resource_draft_destroy
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/user_profile:
    get:
      operationId: user_profile_retrieve
      description: Returns the authenticated user's profile, group memberships, and
        linked Contributor resource id.
      tags:
      - user_profile
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
components:
  schemas:
    DashboardCard:
      type: object
      properties:
        id:
          type: string
          description: Permit application resourceinstanceid; the card's drill-in
            GUID.
        requirement_name:
          type: string
          description: Name of the chosen (first unsatisfied) process requirement.
        requirement_due_date:
          type: string
          description: Process due date of the chosen requirement.
        project_name:
          type: string
          description: Permit application's project name.
        application_number:
          type: string
          description: Permit application's human-readable application reference (e.g.
            "APP-1"); not a GUID. The application's GUID is the card's `id`.
        industrial_sector:
          type: string
          description: Permit application's industrial sector (reference label).
        permit_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the related HCA Permit; its drill-in
            GUID.
        permit_number:
          type: string
          description: Permit number of the related HCA Permit.
        permit_holder:
          type: string
          description: Permit holder name(s) on the related HCA Permit (Contributor).
        permit_holder_ids:
          type: array
          items:
            type: string
          description: Resourceinstanceids of the permit holder Contributor(s); their
            drill-in GUIDs.
        project_officer:
          type: string
          description: Project officer on the permit's application_admin group (Contributor
            name).
        project_officer_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the project officer Contributor; its
            drill-in GUID.
        assessment_notes:
          type: string
          description: Assessment notes on the chosen requirement.
        ministry_assignee_name:
          type: string
          description: Ministry assignee on the chosen requirement tile (Contributor
            name).
        ministry_assignee_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the ministry assignee Contributor; its
            drill-in GUID.
        ministry_assignee_change_date:
          type: string
          description: Edit-log date the chosen tile's ministry_assignee last changed.
        requirement_id:
          type: string
          description: Resourceinstanceid of the chosen Process Requirement; the drill-in
            target.
        urgency:
          type: integer
          description: Relative urgency from the target completion date and the current
            date.
        priority_level:
          type: string
          description: Permit application's priority level (reference label).
      required:
      - id
    DashboardPage:
      type: object
      description: |-
        One page of dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them). Each card's fields
        are documented on the DashboardCard dataclass (as field help_text), so the
        per-field descriptions surface in the generated OpenAPI spec.
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCard'
    NodeValueEnvelope:
      type: object
      description: |-
        The {node_value, display_value, details} object node value fields emit when as_representation is True.

        Mirrors the dict built in arches_querysets TileTree.get_value_with_context;
        keep in sync if that shape changes upstream (unit test covers this).
      properties:
        node_value: {}
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - details
      - display_value
      - node_value
    PatchedProcessRequirement:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          readOnly: true
          nullable: true
        descriptors:
          readOnly: true
          nullable: true
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
    PatchedResourceDraft:
      type: object
      properties:
        draftid:
          type: string
          format: uuid
          readOnly: true
        graph_has_different_publication:
          type: boolean
          description: True when the published graph has moved on since the draft
            was saved.
          readOnly: true
        graph_slug:
          type: string
          readOnly: true
        graph_publication_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        frontend_version:
          type: string
          nullable: true
          maxLength: 50
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        data: {}
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
    ProcessRequirement:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          readOnly: true
          nullable: true
        descriptors:
          readOnly: true
          nullable: true
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
      required:
      - createdtime
      - descriptors
      - graph_has_different_publication
      - graph_publication
      - legacyid
      - name
      - principaluser
      - resource_instance_lifecycle_state
    Process_Requirement_Is_Template_Requirement_Aliased_Data:
      type: object
      properties:
        has_submission_requirement:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
        is_internal_requirement:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
        default_target_processing_time:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          title: Default Target Processing Time (days)
          description: Enter number
        is_template_requirement:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
      required:
      - has_submission_requirement
      - is_internal_requirement
      - is_template_requirement
    Process_Requirement_Is_Template_Requirement_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Is_Template_Requirement_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          nullable: true
    Process_Requirement_Requirement_Execution_Duration_Aliased_Data:
      type: object
      properties:
        requirement_process_start_date:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          description: Enter date
        requirement_process_due_date:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          description: Enter date
        requirement_process_completion_date:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          description: Enter date
    Process_Requirement_Requirement_Execution_Duration_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Requirement_Execution_Duration_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
