openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/dashboard:
    get:
      operationId: api_dashboard_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: contributor_id
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: order_by
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - UNASSIGNED
          - null
          type: string
          nullable: true
          minLength: 1
        description: '* `UNASSIGNED` - Unassigned'
      tags:
      - dashboard
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
          description: ''
  /bcap/api/resource/process_requirement/{id}:
    get:
      operationId: api_resource_process_requirement_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    put:
      operationId: api_resource_process_requirement_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    patch:
      operationId: api_resource_process_requirement_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    delete:
      operationId: api_resource_process_requirement_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/user_profile:
    get:
      operationId: user_profile_retrieve
      description: Returns the authenticated user's profile, group memberships, and
        linked Contributor resource id.
      tags:
      - user_profile
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
components:
  schemas:
    BooleanAliasedNodeData:
      type: object
      properties:
        node_value:
          type: boolean
          nullable: true
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    DashboardCard:
      type: object
      properties:
        id:
          type: string
          description: Permit application resourceinstanceid; the card's drill-in
            GUID.
        requirement_name:
          type: string
          description: Name of the chosen (first unsatisfied) process requirement.
        requirement_due_date:
          type: string
          description: Process due date of the chosen requirement.
        project_name:
          type: string
          description: Permit application's project name.
        application_number:
          type: string
          description: Permit application's human-readable application reference (e.g.
            "APP-1"); not a GUID. The application's GUID is the card's `id`.
        industrial_sector:
          type: string
          description: Permit application's industrial sector (reference label).
        permit_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the related HCA Permit; its drill-in
            GUID.
        permit_number:
          type: string
          description: Permit number of the related HCA Permit.
        permit_holder:
          type: string
          description: Permit holder name(s) on the related HCA Permit (Contributor).
        permit_holder_ids:
          type: array
          items:
            type: string
          description: Resourceinstanceids of the permit holder Contributor(s); their
            drill-in GUIDs.
        project_officer:
          type: string
          description: Project officer on the permit's application_admin group (Contributor
            name).
        project_officer_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the project officer Contributor; its
            drill-in GUID.
        assessment_notes:
          type: string
          description: Assessment notes on the chosen requirement.
        ministry_assignee_name:
          type: string
          description: Ministry assignee on the chosen requirement tile (Contributor
            name).
        ministry_assignee_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the ministry assignee Contributor; its
            drill-in GUID.
        ministry_assignee_change_date:
          type: string
          description: Edit-log date the chosen tile's ministry_assignee last changed.
        requirement_id:
          type: string
          description: Resourceinstanceid of the chosen Process Requirement; the drill-in
            target.
        urgency:
          type: integer
          description: Relative urgency from the target completion date and the current
            date.
        priority_level:
          type: string
          description: Permit application's priority level (reference label).
      required:
      - id
    DashboardPage:
      type: object
      description: |-
        One page of dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them). Each card's fields
        are documented on the DashboardCard dataclass (as field help_text), so the
        per-field descriptions surface in the generated OpenAPI spec.
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCard'
    DateAliasedNodeData:
      type: object
      properties:
        node_value:
          type: string
          format: date-time
          nullable: true
          description: Enter date
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    NumberAliasedNodeData:
      type: object
      properties:
        node_value:
          type: number
          format: double
          nullable: true
          title: Default Target Processing Time (days)
          description: Enter number
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    PatchedProcessRequirement:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        descriptors:
          type: object
          readOnly: true
          nullable: true
          properties:
            en:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                map_popup:
                  type: string
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
    ProcessRequirement:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        descriptors:
          type: object
          readOnly: true
          nullable: true
          properties:
            en:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                map_popup:
                  type: string
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
      required:
      - createdtime
      - descriptors
      - graph_has_different_publication
      - graph_publication
      - legacyid
      - name
      - principaluser
      - resource_instance_lifecycle_state
    Process_Requirement_Is_Template_Requirement_Aliased_Data:
      type: object
      properties:
        has_submission_requirement:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
        is_internal_requirement:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
        default_target_processing_time:
          allOf:
          - $ref: '#/components/schemas/NumberAliasedNodeData'
          nullable: true
          title: Default Target Processing Time (days)
          description: Enter number
        is_template_requirement:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
      required:
      - has_submission_requirement
      - is_internal_requirement
      - is_template_requirement
    Process_Requirement_Is_Template_Requirement_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Is_Template_Requirement_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              value:
                type: object
                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    Process_Requirement_Requirement_Execution_Duration_Aliased_Data:
      type: object
      properties:
        requirement_process_start_date:
          allOf:
          - $ref: '#/components/schemas/DateAliasedNodeData'
          nullable: true
          description: Enter date
        requirement_process_due_date:
          allOf:
          - $ref: '#/components/schemas/DateAliasedNodeData'
          nullable: true
          description: Enter date
        requirement_process_completion_date:
          allOf:
          - $ref: '#/components/schemas/DateAliasedNodeData'
          nullable: true
          description: Enter date
    Process_Requirement_Requirement_Execution_Duration_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Requirement_Execution_Duration_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              value:
                type: object
                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    Process_Requirement_Requirement_Identification_Aliased_Data:
      type: object
      properties:
        requirement_identification:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          description: Enter text
        requirement_name:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          description: Enter text
        is_template_requirement:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Is_Template_Requirement_Tile'
          nullable: true
      required:
      - requirement_identification
      - requirement_name
    Process_Requirement_Requirement_Identification_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Requirement_Identification_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              value:
                type: object
                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    Process_Requirement_Requirment_Submission_Aliased_Data:
      type: object
      properties:
        requirment_submission:
          allOf:
          - $ref: '#/components/schemas/ResourceInstanceAliasedNodeData'
          nullable: true
    Process_Requirement_Requirment_Submission_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Requirment_Submission_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              value:
                type: object
                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    Process_Requirement_Sub_Requirement_Aliased_Data:
      type: object
      properties:
        sub_requirement_assessment_notes:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          title: Assessment Notes
          description: Enter text
        sub_requirement_description:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          title: Description
          description: Enter text
        sub_requirement_mandatory:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
          title: Mandatory
        sub_requirement_reference:
          allOf:
          - $ref: '#/components/schemas/ResourceInstanceAliasedNodeData'
          nullable: true
        sub_requirement_satisfied:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
          title: Requirement Satisfied
        sub_requirement_sort_order:
          allOf:
          - $ref: '#/components/schemas/NumberAliasedNodeData'
          nullable: true
          title: Sort Order
          description: Enter number
        sub_requirement_name:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          title: Requirement
          description: Enter text
      required:
      - sub_requirement_name
      - sub_requirement_sort_order
    Process_Requirement_Sub_Requirement_Assessment_N1_Aliased_Data:
      type: object
      properties:
        requirement_status:
          allOf:
          - $ref: '#/components/schemas/BooleanAliasedNodeData'
          nullable: true
        assessment_notes:
          allOf:
          - $ref: '#/components/schemas/StringAliasedNodeData'
          nullable: true
          description: Enter text
    Process_Requirement_Sub_Requirement_Assessment_N1_Tile:
      type: object
