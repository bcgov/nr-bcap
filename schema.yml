openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/assignable_groups:
    get:
      operationId: api_assignable_groups_retrieve
      description: Role group names an invited user can be granted.
      tags:
      - 'Admin: registration'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /bcap/api/contributors/unlinked:
    get:
      operationId: api_contributors_unlinked_list
      description: Contributors not yet linked to a user account.
      tags:
      - 'Admin: registration'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContributorOption'
          description: ''
  /bcap/api/dashboard/external:
    get:
      operationId: api_dashboard_external_retrieve
      description: |-
        The applicant-facing dashboard: cards for the requesting user's own and
        their associated companies' permit applications (and their drafts), scoped by
        created-by.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - DRAFTS
          - CREATED_BY_ME
          - CREATED_BY_ASSOCIATED_COMPANIES
          type: string
          default: CREATED_BY_ME
          minLength: 1
        description: |-
          * `DRAFTS` - Drafts
          * `CREATED_BY_ME` - My Projects
          * `CREATED_BY_ASSOCIATED_COMPANIES` - Created by associated companies
      tags:
      - 'External: dashboard'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDashboardPage'
          description: ''
  /bcap/api/dashboard/internal:
    get:
      operationId: api_dashboard_internal_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - UNASSIGNED
          - ASSIGNED_TO_ME
          type: string
          minLength: 1
        description: |-
          * `UNASSIGNED` - Unassigned
          * `ASSIGNED_TO_ME` - Assigned to me
      tags:
      - 'Internal: dashboard'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalDashboardPage'
          description: ''
  /bcap/api/registration_link:
    post:
      operationId: api_registration_link_create
      description: Issue a single-use signup link for a Contributor.
      tags:
      - 'Admin: registration'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationLinkRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationLinkResponse'
          description: ''
  /bcap/api/resource/hca_permit:
    get:
      operationId: api_resource_hca_permit_list
      description: |-
        GET the requesting user's HCA Permits.

        Read-only and owner-scoped: returns only the permits the user created.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - 'External: hca_permit'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHCAPermitList'
          description: ''
  /bcap/api/resource/hca_permit/{id}:
    get:
      operationId: api_resource_hca_permit_retrieve
      description: |-
        GET an HCA Permit and its nested tiles.

        Read-only, and scoped to the requesting user's own permits: requesting one
        created by another user returns 404.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: hca_permit'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HCAPermit'
          description: ''
  /bcap/api/resource/permit_application:
    post:
      operationId: api_resource_permit_application_create
      description: |-
        POST a new Permit Application, seeding its application id.

        Create-only: CreateAPIView exposes just POST (and OPTIONS); there is no
        list/GET route. The requirements are attached later, on submission (see the
        detail view).
      tags:
      - 'External: permit_application'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitApplication'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
  /bcap/api/resource/permit_application/{id}:
    get:
      operationId: api_resource_permit_application_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        The update that first sets the submission date is the submission: it
        assigns the application id and attaches the requirement working copies.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    put:
      operationId: api_resource_permit_application_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        The update that first sets the submission date is the submission: it
        assigns the application id and attaches the requirement working copies.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PermitApplication'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    patch:
      operationId: api_resource_permit_application_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        The update that first sets the submission date is the submission: it
        assigns the application id and attaches the requirement working copies.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    delete:
      operationId: api_resource_permit_application_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        The update that first sets the submission date is the submission: it
        assigns the application id and attaches the requirement working copies.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/api/resource/process_requirement/{id}:
    get:
      operationId: api_resource_process_requirement_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'Internal: process_requirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    put:
      operationId: api_resource_process_requirement_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'Internal: process_requirement'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    patch:
      operationId: api_resource_process_requirement_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'Internal: process_requirement'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    delete:
      operationId: api_resource_process_requirement_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'Internal: process_requirement'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/api/resource_draft/{graph_slug}:
    get:
      operationId: api_resource_draft_list
      description: GET the current user's drafts for a graph; POST a new draft.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      tags:
      - 'External: resource_draft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceDraft'
          description: ''
    post:
      operationId: api_resource_draft_create
      description: GET the current user's drafts for a graph; POST a new draft.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      tags:
      - 'External: resource_draft'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
  /bcap/api/resource_draft/{graph_slug}/{id}:
    get:
      operationId: api_resource_draft_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: resource_draft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    put:
      operationId: api_resource_draft_update
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: resource_draft'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    patch:
      operationId: api_resource_draft_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: resource_draft'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResourceDraft'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDraft'
          description: ''
    delete:
      operationId: api_resource_draft_destroy
      description: |-
        GET/PUT/PATCH/DELETE a single draft. PUT replaces the whole blob; PATCH
        shallow-merges by section key -- untouched sections are kept, but a section
        present in the body is replaced wholesale (no deep merge), so the client must
        send the complete section, not just changed fields within it.
      parameters:
      - in: path
        name: graph_slug
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: resource_draft'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/user_profile:
    get:
      operationId: user_profile_retrieve
      description: Returns the authenticated user's profile, group memberships, and
        linked Contributor resource id.
      tags:
      - 'External: user_profile'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
components:
  schemas:
    BooleanAliasedNodeData:
      type: object
      properties:
        node_value:
          type: boolean
          nullable: true
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    ContributorOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        type:
          type: string
      required:
      - email
      - id
      - name
      - type
    DateAliasedNodeData:
      type: object
      properties:
        node_value:
          type: string
          format: date-time
          nullable: true
          description: Enter date
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    ExternalDashboardCard:
      type: object
      properties:
        id:
          type: string
          description: Permit application resourceinstanceid, or draft id when is_draft;
            the card's drill-in / resume GUID.
        is_draft:
          type: boolean
          description: True when this card is an unsubmitted draft (from a ResourceDraft,
            graph_slug=permit_application) rather than a saved application.
        status:
          type: string
          description: Applicant-facing workflow status, e.g. Permit Active, Under
            Review, Submit Documents, Submission Required.
        created_by_name:
          type: string
          description: Display name of the user who created the application (principaluser).
        created_date:
          type: string
          description: ISO timestamp the application was submitted (its createdtime),
            or the draft was created when is_draft.
        project_name:
          type: string
          description: Permit application's project name.
        application_number:
          type: string
          description: Permit application's human-readable application reference;
            not a GUID.
        industrial_sector:
          type: string
          description: Permit application's industrial sector (reference label).
        permit_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the related HCA Permit; its drill-in
            GUID.
        permit_number:
          type: string
          description: Permit number of the related HCA Permit.
        urgency:
          type: integer
          description: Relative urgency from the target completion date and the current
            date.
        priority_level:
          type: string
          description: Permit application's priority level (reference label).
      required:
      - id
    ExternalDashboardPage:
      type: object
      description: |-
        One page of external dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them). Each card's fields
        are documented on the ExternalDashboardCard dataclass (as field help_text),
        so the per-field descriptions surface in the generated OpenAPI spec.
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExternalDashboardCard'
    FileListAliasedNodeData:
      type: object
      properties:
        node_value:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name:
                type: string
              size:
                type: number
              type:
                type: string
              url:
                type: string
                nullable: true
              file:
                type: object
                properties:
                  objectURL:
                    type: string
                    nullable: true
              node_id:
                type: string
                format: uuid
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    GeojsonFeatureCollectionAliasedNodeData:
      type: object
      properties:
        node_value:
          type: object
          nullable: true
          properties:
            type:
              type: string
            features:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  geometry:
                    type: object
                    additionalProperties: true
                  properties:
                    type: object
                    additionalProperties: true
                    nullable: true
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    HCAPermit:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Hca_Permit_Resource_Aliased_Data'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        descriptors:
          type: object
          readOnly: true
          nullable: true
          properties:
            en:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                map_popup:
                  type: string
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
      required:
      - createdtime
      - descriptors
      - graph_has_different_publication
      - graph_publication
      - legacyid
      - name
      - principaluser
      - resource_instance_lifecycle_state
    Hca_Permit_Permit_Identification_Aliased_Data:
      type: object
      properties:
        permit_number:
          allOf:
          - $ref: '#/components/schemas/NonLocalizedStringAliasedNodeData'
          nullable: true
          description: Enter text
        hca_permit_type:
          allOf:
          - $ref: '#/components/schemas/ReferenceAliasedNodeData'
          nullable: true
          description: Select an option
        issuing_agency:
          allOf:
          - $ref: '#/components/schemas/ReferenceAliasedNodeData'
          nullable: true
          description: Select an option
        permit_holder:
          allOf:
