openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/dashboard:
    get:
      operationId: api_dashboard_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: order_by
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - UNASSIGNED
          - ASSIGNED_TO_ME
          - ASSIGNED_TO_ASSOCIATED_COMPANIES
          type: string
          minLength: 1
        description: |-
          * `UNASSIGNED` - Unassigned
          * `ASSIGNED_TO_ME` - Assigned to me
          * `ASSIGNED_TO_ASSOCIATED_COMPANIES` - Assigned to associated companies
      tags:
      - dashboard
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
          description: ''
  /bcap/api/resource/permit_application/:
    post:
      operationId: api_resource_permit_application_create
      description: |-
        POST a new Permit Application.

        Create-only: CreateAPIView exposes just POST (and OPTIONS); there is no
        list/GET route.
      tags:
      - permit_application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitApplication'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
  /bcap/api/resource/permit_application/{id}:
    get:
      operationId: api_resource_permit_application_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - permit_application
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    put:
      operationId: api_resource_permit_application_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - permit_application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PermitApplication'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    patch:
      operationId: api_resource_permit_application_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - permit_application
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    delete:
      operationId: api_resource_permit_application_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - permit_application
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/api/resource/process_requirement/{id}:
    get:
      operationId: api_resource_process_requirement_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
