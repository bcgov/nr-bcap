                $ref: '#/components/schemas/PermitApplication'
          description: ''
  /bcap/api/resource/permit_application/{id}:
    get:
      operationId: api_resource_permit_application_retrieve
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    put:
      operationId: api_resource_permit_application_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PermitApplication'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermitApplication'
          description: ''
    patch:
      operationId: api_resource_permit_application_partial_update
      description: |-
        GET/PUT/PATCH/DELETE a Permit Application and its nested tiles.

        Scoped to the requesting user's own applications: requesting one created by
        another user returns 404.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: permit_application'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPermitApplication'
      security:
      - cookieAuth: []
      responses:
