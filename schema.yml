openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/dashboard:
    get:
      operationId: api_dashboard_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: contributor_id
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: order_by
        schema:
          type: string
          nullable: true
          minLength: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          type: string
          nullable: true
          minLength: 1
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
          description: ''
  /bcap/user_profile:
    get:
      operationId: user_profile_retrieve
      description: Returns the authenticated user's profile, group memberships, and
        linked Contributor resource id.
      tags:
      - user_profile
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
components:
  schemas:
    DashboardCard:
      type: object
      properties:
        id:
          type: string
        cap_label:
          type: string
        cap_date:
          type: string
        body_title:
          type: string
        body_subtitle1:
          type: string
        body_subtitle2:
          type: string
        body1:
          type: string
        body2:
          type: string
        body3:
          type: string
        body4:
          type: string
        body5:
          type: string
        footer_name:
          type: string
        footer_date:
          type: string
        route:
          type: string
        urgency:
          type: integer
        cap_priority:
          type: string
      required:
      - id
    DashboardPage:
      type: object
      description: |-
        One page of dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them).
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCard'
    UserProfileResponse:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        groups:
          type: array
          items:
            type: string
          readOnly: true
        contributor_id:
          type: string
          nullable: true
          description: TODO fill this in.
          readOnly: true
      required:
      - contributor_id
      - first_name
      - groups
      - last_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bcap
