          description: ''
  /bcap/api/dashboard/external:
    get:
      operationId: api_dashboard_external_retrieve
      description: |-
        The applicant-facing dashboard: cards for the requesting user's own and
        their associated companies' permit applications (and their drafts), scoped by
        created-by.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - DRAFTS
          - CREATED_BY_ME
          - CREATED_BY_ASSOCIATED_COMPANIES
          type: string
          default: CREATED_BY_ME
          minLength: 1
        description: |-
          * `DRAFTS` - Drafts
          * `CREATED_BY_ME` - My Projects
          * `CREATED_BY_ASSOCIATED_COMPANIES` - Created by associated companies
      tags:
      - 'External: dashboard'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDashboardPage'
          description: ''
  /bcap/api/dashboard/internal:
    get:
      operationId: api_dashboard_internal_retrieve
      description: Returns dashboard cards for the current user based on their role.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - UNASSIGNED
          - ASSIGNED_TO_ME
          type: string
          minLength: 1
        description: |-
          * `UNASSIGNED` - Unassigned
          * `ASSIGNED_TO_ME` - Assigned to me
      tags:
      - 'Internal: dashboard'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalDashboardPage'
          description: ''
