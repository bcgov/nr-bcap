          nullable: true
    Process_Requirement_Requirement_Identification_Aliased_Data:
      type: object
      properties:
        requirement_name:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          description: Enter text
        requirement_identification:
          allOf:
          - $ref: '#/components/schemas/NodeValueEnvelope'
          nullable: true
          description: Enter text
        is_template_requirement:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Is_Template_Requirement_Tile'
