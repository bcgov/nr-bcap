                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    Process_Requirement_Sub_Requirement_Tile:
      type: object
      properties:
        tileid:
          type: string
          format: uuid
          nullable: true
        resourceinstance:
          type: string
          format: uuid
          nullable: true
        nodegroup:
          type: string
          format: uuid
          nullable: true
        parenttile:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/Process_Requirement_Sub_Requirement_Aliased_Data'
        sortorder:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        provisionaledits:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              value:
                type: object
                additionalProperties: true
              status:
                type: string
              action:
                type: string
              reviewer:
                type: integer
                nullable: true
              timestamp:
                type: string
                nullable: true
              reviewtimestamp:
                type: string
                nullable: true
    ResourceAliasedData:
      type: object
      properties:
        requirement_identification:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Requirement_Identification_Tile'
          nullable: true
        requirement_execution_duration:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Requirement_Execution_Duration_Tile'
          nullable: true
        requirment_submission:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Requirment_Submission_Tile'
          nullable: true
        sub_requirement_assessment_n1:
          allOf:
          - $ref: '#/components/schemas/Process_Requirement_Sub_Requirement_Assessment_N1_Tile'
          nullable: true
        sub_requirement:
          type: array
          items:
            $ref: '#/components/schemas/Process_Requirement_Sub_Requirement_Tile'
          nullable: true
    ResourceInstanceAliasedNodeData:
      type: object
      properties:
        node_value:
          type: object
          properties:
            resourceId:
              type: string
              format: uuid
            ontologyProperty:
              type: string
              nullable: true
            resourceXresourceId:
              type: string
              nullable: true
            inverseOntologyProperty:
              type: string
              nullable: true
          nullable: true
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/ResourceInstanceDetail'
          readOnly: true
      required:
      - node_value
    ResourceInstanceDetail:
      type: object
      description: One related resource summarized into a resource-instance node's
        `details`.
      properties:
        resource_id:
          type: string
          format: uuid
          nullable: true
        display_value:
          type: string
      required:
      - display_value
      - resource_id
    StringAliasedNodeData:
      type: object
      properties:
        node_value:
          type: object
          nullable: true
          properties:
            en:
              type: object
              properties:
                value:
                  type: string
                  nullable: true
                direction:
                  type: string
                  enum:
                  - ltr
                  - rtl
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - node_value
    UserProfileResponse:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        groups:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - first_name
      - groups
      - last_name
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bcap
