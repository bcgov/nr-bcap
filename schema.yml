      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProcessRequirement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRequirement'
          description: ''
    delete:
      operationId: api_resource_process_requirement_destroy
      description: |-
        GET/PUT/PATCH/DELETE a Process Requirement and its sub-requirements.

        PATCH applies a partial diff (only the tiles present in the body); PUT
        replaces. Either way the serializer saves the nested sub-requirement tiles.

        Process Requirements are created internally (cloned from templates by the
        process_requirement service), not via a public POST, so there is no create
        route here.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - process_requirement
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /bcap/user_profile:
    get:
      operationId: user_profile_retrieve
      description: Returns the authenticated user's profile, group memberships, and
        linked Contributor resource id.
      tags:
      - user_profile
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
components:
  schemas:
    DashboardCard:
      type: object
      properties:
        id:
          type: string
          description: Permit application resourceinstanceid; the card's drill-in
            GUID.
        requirement_name:
          type: string
          description: Name of the chosen (first unsatisfied) process requirement.
        requirement_due_date:
          type: string
          description: Process due date of the chosen requirement.
        project_name:
          type: string
          description: Permit application's project name.
        application_number:
          type: string
          description: Permit application's human-readable application reference (e.g.
            "APP-1"); not a GUID. The application's GUID is the card's `id`.
        industrial_sector:
          type: string
          description: Permit application's industrial sector (reference label).
        permit_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the related HCA Permit; its drill-in
            GUID.
        permit_number:
          type: string
          description: Permit number of the related HCA Permit.
        permit_holder:
          type: string
          description: Permit holder name(s) on the related HCA Permit (Contributor).
        permit_holder_ids:
          type: array
          items:
            type: string
          description: Resourceinstanceids of the permit holder Contributor(s); their
            drill-in GUIDs.
        project_officer:
          type: string
          description: Project officer on the permit's application_admin group (Contributor
            name).
        project_officer_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the project officer Contributor; its
            drill-in GUID.
        assessment_notes:
          type: string
          description: Assessment notes on the chosen requirement.
        ministry_assignee_name:
          type: string
          description: Ministry assignee on the chosen requirement tile (Contributor
            name).
        ministry_assignee_id:
          type: string
          nullable: true
          description: Resourceinstanceid of the ministry assignee Contributor; its
            drill-in GUID.
        ministry_assignee_change_date:
          type: string
          description: Edit-log date the chosen tile's ministry_assignee last changed.
        requirement_id:
          type: string
          description: Resourceinstanceid of the chosen Process Requirement; the drill-in
            target.
        urgency:
          type: integer
          description: Relative urgency from the target completion date and the current
            date.
        priority_level:
          type: string
          description: Permit application's priority level (reference label).
      required:
      - id
    DashboardPage:
      type: object
      description: |-
        One page of dashboard cards for the current user.

        `count` is the total number of cards matching the query across all pages;
        `page` and `limit` echo the requested page number and page size; `results`
        holds the cards for this page (at most `limit` of them). Each card's fields
        are documented on the DashboardCard dataclass (as field help_text), so the
        per-field descriptions surface in the generated OpenAPI spec.
      properties:
        count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCard'
    NodeValueEnvelope:
      type: object
      description: |-
        The {node_value, display_value, details} object node value fields emit when as_representation is True.

        Mirrors the dict built in arches_querysets TileTree.get_value_with_context;
        keep in sync if that shape changes upstream (unit test covers this).
      properties:
        node_value: {}
        display_value:
          type: string
          readOnly: true
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - details
      - display_value
      - node_value
    PatchedPermitApplication:
      type: object
      properties:
        resourceinstanceid:
          type: string
          format: uuid
          nullable: true
        aliased_data:
          $ref: '#/components/schemas/ResourceAliasedData'
        graph_has_different_publication:
          type: boolean
          readOnly: true
        name:
          readOnly: true
          nullable: true
        descriptors:
          readOnly: true
          nullable: true
        legacyid:
          type: string
          readOnly: true
          nullable: true
        createdtime:
          type: string
          format: date-time
          readOnly: true
        graph:
          type: string
          format: uuid
          nullable: true
        graph_publication:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        resource_instance_lifecycle_state:
          type: string
          format: uuid
          readOnly: true
        principaluser:
          type: integer
          readOnly: true
          nullable: true
    PatchedProcessRequirement:
