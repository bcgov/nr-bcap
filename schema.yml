openapi: 3.0.3
info:
  title: BCAP API
  version: 2.0.0
  description: BC Archaeology Portal API
paths:
  /bcap/api/archaeological_site:
    get:
      operationId: api_archaeological_site_list
      description: |-
        GET the requesting user's Archaeological Site resources.

        Read-only and owner-scoped: returns only the resources the user created.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - 'External: archaeological_site'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArchaeologicalSiteList'
          description: ''
  /bcap/api/archaeological_site/{id}/:
    get:
      operationId: api_archaeological_site_retrieve
      description: |-
        GET a Archaeological Site resource and its nested tiles.

        Read-only, and scoped to the requesting user's own resources: requesting
        one created by another user returns 404.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - 'External: archaeological_site'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchaeologicalSite'
          description: ''
